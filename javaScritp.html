<!DOCTYPE html>
<html>
<head>
    <title>JavaScript</title>
</head>
<body>

    <ul id="lista"></ul>
    <button id="btnAgregar">agregar elemento</button>

    <script>
        const lista = document.getElementById("lista");
        const boton = document.getElementById("btnAgregar");

        boton.addEventListener("click", ()=>{
            const li = documen.createElement("li");
            li.textContent = "JavaScript";
            lista.appendChild(li);
        })
    </script>

    <button id="btn">Haz clic aquí</button>
    <script>
        const Boton = document.getElementById("btn");
         Boton.addEventListener("click", ()=>{
            console.log("Se hizo click");
            alert("!Boton precionado!")
         })

    </script>

    <h1>Presiona una tecla</h1>
    <p id="resultado"></p>
    <script>
    const resultado = document.getElementById("resultado");
        document.addEventListener("keydown", (evento) => {
        console.log("Tecla:", evento.key); // se ve en consola
        alert("Tecla presionada!");
        resultado.textContent = "Presionaste: " + evento.key; // se ve en la página
    });
    </script>

    <form id="formulario">
        <input id="nombre" type="text" />
        <button type="submit">Guardar</button>
    </form>

    <script>
    const formulario = document.getElementById("formulario");
        formulario.addEventListener("submit", (evento) => {
        evento.preventDefault(); // evita que la página se recargue
        const nombre = document.getElementById("nombre").value; // obtiene el valor del input
        alert("Dato guardado!");
        console.log("Nombre:", nombre); // muestra el dato en consola
    });
    </script>
    
</body>
</html>
