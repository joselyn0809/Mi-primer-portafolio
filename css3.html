<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css3.css">
</head>
<body>
    <h2>Display: block</h2>
    <div class="block">bloque 1</div>
    <div class="block">bloque 2</div>

    <h2>Display: inline</h2>
    <span class="inline">A</span>
    <span class="inline">B</span>
    <span class="inline">C</span>

    <h2>Display: inline-block</h2>
    <div class="inline-block">A</div>
    <div class="inline-block">B</div>
    <div class="inline-block">C</div>

    <h2>Display: none</h2>
    <div class="none">Este texto no se vera</div>
</body>
</html>
